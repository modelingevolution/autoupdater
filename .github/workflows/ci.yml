name: Tests (CI)

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Create Allure results directory
      run: mkdir -p ./allure-results
        
    - name: Run Unit Tests Only
      run: |
        # Build and test only unit tests, avoiding solution file issues and generate Allure results
        dotnet test tests/ModelingEvolution.AutoUpdater.Tests/ \
          --configuration Release \
          --logger "console;verbosity=normal"
        
    # bug-019: the unit suite is green on any SSH.NET version (it runs against fakes). The version guard is this integration class,
    # which starts a throwaway sshd via Testcontainers - Docker is available on GitHub-hosted ubuntu runners. The rest of the
    # IntegrationTests project needs the full AutoUpdater stack and stays out of CI.
    - name: Run bug-019 SSH integration tests (real sshd)
      run: |
        dotnet test tests/ModelingEvolution.AutoUpdater.IntegrationTests/ \
          --configuration Release \
          --filter "FullyQualifiedName~SshCommandTimeoutIntegrationTests|FullyQualifiedName~SshServiceFileOperationsIntegrationTests" \
          --logger "console;verbosity=normal"

    - name: Upload Allure results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-results-autoupdater
        path: ./allure-results
        retention-days: 30