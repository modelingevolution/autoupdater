# Runs as the unprivileged nginx user on a read-only root filesystem: everything writable is under /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

http {
    access_log off;
    server_tokens off;
    sendfile on;
    autoindex off;
    disable_symlinks on;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    types {
        application/vnd.android.package-archive apk;
        application/vnd.debian.binary-package deb;
    }
    default_type application/octet-stream;

    server {
        listen 8080 default_server;
        client_max_body_size 0;

        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /manifest.json {
            root /srv/apps;
            default_type application/json;
            add_header Cache-Control "no-store" always;
        }

        # Written by verify-files.sh when the container starts.
        location = /verification.json {
            root /tmp/apps-state;
            default_type application/json;
            add_header Cache-Control "no-store" always;
        }

        # One plain file name. nginx has already normalised the URI, and a name cannot hold a slash here,
        # so a request cannot leave /srv/apps/files. Range requests are nginx's default for a static file.
        location ~ "^/files/([A-Za-z0-9][A-Za-z0-9._+~-]*)$" {
            set $app_file $1;

            # verify-files.sh marks a file whose bytes do not match the manifest. It is never served.
            if (-f /tmp/apps-state/blocked/$app_file) {
                return 503;
            }

            root /srv/apps;
            add_header Content-Disposition "attachment; filename=\"$app_file\"" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location / {
            return 404;
        }
    }
}
