# Runs as the unprivileged nginx user on a read-only root filesystem: everything writable is under /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    sendfile on;
    autoindex off;
    disable_symlinks on;

    # Slow or stalled clients give their connection back instead of holding it.
    client_header_timeout 15s;
    send_timeout 60s;
    keepalive_timeout 15s;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    types {
        application/vnd.android.package-archive apk;
        application/vnd.debian.binary-package deb;
        application/x-msi msi;
    }
    default_type application/octet-stream;

    server {
        listen 8080 default_server;
        client_max_body_size 0;

        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /manifest.json {
            root /srv/apps;
            default_type application/json;
            add_header Cache-Control "no-store" always;
        }

        # Written by verify-files.sh when the container starts.
        location = /verification.json {
            root /tmp/apps-state;
            default_type application/json;
            add_header Cache-Control "no-store" always;
        }

        # One plain file name of at most 128 characters, the limit publish-apps.sh and the AutoUpdater apply too. nginx has
        # already decoded and normalised the URI, and a name cannot hold a slash here, so a request cannot leave
        # /srv/apps/files. Range requests are nginx's default for a static file.
        location ~ "^/files/([A-Za-z0-9][A-Za-z0-9._+~-]{0,127})\z" {
            set $app_file $1;

            # Fail closed: only a file verify-files.sh hashed and found matching the manifest is served. Started any other
            # way (another entrypoint, a check that stopped early) nothing has a marker, so nothing is served.
            if (!-f /tmp/apps-state/ok/$app_file) {
                return 503;
            }

            root /srv/apps;
            # Each file's mtime is derived from its SHA-256 (publish-apps.sh), so the ETag and Last-Modified differ between
            # builds: a browser revalidates (no-cache) instead of reusing an older installer of the same name, and an
            # If-Range resume of an older build gets the whole new file instead of joining the two.
            add_header Cache-Control "no-cache" always;
            add_header Content-Disposition "attachment; filename=\"$app_file\"" always;
            add_header X-Content-Type-Options "nosniff" always;
            max_ranges 1;
        }

        location / {
            return 404;
        }
    }
}
