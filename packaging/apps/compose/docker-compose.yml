name: apps

# AutoUpdater deploy package for an apps image (packaging/apps): downloadable files, their guides and manifest.json.
# A template: copy this directory into the product's own compose repository and set the image in all three compose
# files (update-version.sh and prune-old-images.sh read it from here).
# AutoUpdater pulls the pinned image and runs it; this file never builds.
# `up -d`:  docker compose -f docker-compose.yml -f docker-compose.x64.yml up -d    # x86_64
#           docker compose -f docker-compose.yml -f docker-compose.arm64.yml up -d  # ARM64

services:
  apps:
    image: registry.example.com/example/apps:0.0.0
    container_name: apps
    restart: unless-stopped

    # Serves static files as an unprivileged user; nginx writes only its pid and temp files, to /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Not on the LAN: browsers download through the AutoUpdater (/apps/files/<name>), which reaches this port the way it
    # reaches the host over SSH, at the Docker bridge's gateway address (172.17.0.1 unless the station's docker0 has
    # another address; then set APPS_BIND_ADDRESS to it). Binding there keeps the port off every other interface.
    # 127.0.0.1 would not do: the AutoUpdater runs in a container and cannot reach the host's loopback.
    # The AutoUpdater's Apps:SourceUrl points here, e.g. http://172.17.0.1:8095/.
    ports:
      - "${APPS_BIND_ADDRESS:-172.17.0.1}:${APPS_PORT:-8095}:8080"

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"
